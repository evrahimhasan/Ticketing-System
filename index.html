<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket Booking</title>
    <!-- favicon -->
    <link rel="icon" href="https://i.ibb.co.com/jZfCpW00/347ea4f110a48472365c787f0814a562.jpg">
    <link rel="stylesheet" href="Style/style.css">
</head>

<body>
    <!-- Header -->
    <header class="header">
        <div class="logo">
            <img src="https://i.ibb.co.com/jZfCpW00/347ea4f110a48472365c787f0814a562.jpg" alt="">
        </div>
        <nav>
            <ul>
                <li><a href="">Admin</a></li>
                <li><a href="">Cancel Tickets</a></li>
                <li><a href="">Offers</a></li>
            </ul>
        </nav>
        <div class="login-btn">
            <a href="">Signup</a>
            <a href="">LOGIN</a>
        </div>
    </header>

    <!-- Hero Section -->
    <div class="background">
        <section class="hero">
            <div class="overlay"></div>
            <div class="hero-text">
                <h1>Online Ticketing made easy!</h1>
                <p>Buy tickets online hassle-free.</p>
            </div>

            <!-- Search Box -->
            <div class="search-box">
                <form>
                    <div class="form-group">
                        <label>Leaving From</label>
                        <select>
                            <option>From</option>
                            <option>Mymensingh</option>
                            <option>Chorpara</option>
                            <option>Maskanda</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Going To</label>
                        <select>
                            <option>To</option>
                            <option>Ishwarganj</option>
                            <option>Jamalpur</option>
                            <option>sharishabari</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Departing On</label>
                        <input type="date">
                    </div>
                    <div class="form-group">
                        <label>Coach Type</label>
                        <select>
                            <option>All</option>
                            <option>AC</option>
                            <option>Non-AC</option>
                        </select>
                    </div>
                    <button type="submit" class="search-btn">SEARCH</button>
                </form>
            </div>
        </section>
    </div>
</body>

</html>
